# Runtime and migration identities are configured separately.
spring.datasource.url=${TAPE_ACCOUNTS_URL:jdbc:postgresql://127.0.0.1:5433/tape}
spring.datasource.username=${TAPE_ACCOUNTS_USER:tape_runtime}
spring.datasource.password=${TAPE_ACCOUNTS_PASSWORD}
spring.sql.init.mode=never
spring.flyway.enabled=${TAPE_ACCOUNTS_MIGRATE:false}
spring.flyway.url=${TAPE_ACCOUNTS_URL:jdbc:postgresql://127.0.0.1:5433/tape}
spring.flyway.user=${TAPE_MIGRATION_USER:}
spring.flyway.password=${TAPE_MIGRATION_PASSWORD:}
spring.flyway.locations=classpath:db/migration/postgresql
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
server.error.include-message=never
server.error.include-binding-errors=never
server.servlet.session.timeout=20m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
server.tomcat.max-http-form-post-size=8KB
server.forward-headers-strategy=${TAPE_FORWARD_HEADERS_STRATEGY:none}
server.tomcat.remoteip.internal-proxies=${TAPE_TRUSTED_PROXY_REGEX:}
tape.synthetic-trading.enabled=${TAPE_SYNTHETIC_TRADING_ENABLED:false}
tape.synthetic-trading.matcher=${TAPE_SYNTHETIC_MATCHER_ENABLED:true}
tape.practice-options.enabled=${TAPE_PRACTICE_OPTIONS_ENABLED:false}
tape.practice-options.submissions=${TAPE_PRACTICE_OPTIONS_SUBMISSIONS:true}
tape.practice-options.fee-paise=${TAPE_PRACTICE_OPTIONS_FEE_PAISE:200}
tape.practice-futures.enabled=${TAPE_PRACTICE_FUTURES_ENABLED:false}
tape.practice-futures.submissions=${TAPE_PRACTICE_FUTURES_SUBMISSIONS:true}
tape.practice-futures.fee-paise=${TAPE_PRACTICE_FUTURES_FEE_PAISE:200}

management.endpoints.web.exposure.exclude=
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.access=read-only
management.endpoint.metrics.access=read-only
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db,accountStorage,identityDelivery
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never
logging.structured.format.console=ecs
spring.mvc.log-request-details=false
tape.ops.token=${TAPE_OPS_TOKEN:}
tape.identity.mail.enabled=${TAPE_IDENTITY_MAIL_ENABLED:false}
tape.identity.mail.scheduled=${TAPE_IDENTITY_MAIL_SCHEDULED:true}
spring.mail.host=${TAPE_SMTP_HOST:}
spring.mail.port=${TAPE_SMTP_PORT:587}
spring.mail.username=${TAPE_SMTP_USER:}
spring.mail.password=${TAPE_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
tape.reconciliation.scheduled=${TAPE_RECONCILIATION_SCHEDULED:true}
tape.reconciliation.delay-ms=${TAPE_RECONCILIATION_DELAY_MS:60000}
tape.reconciliation.batch-size=${TAPE_RECONCILIATION_BATCH_SIZE:50}
tape.synthetic-trading.batch-size=${TAPE_MATCH_BATCH_SIZE:100}
tape.synthetic-trading.match-delay-ms=${TAPE_MATCH_DELAY_MS:2000}
