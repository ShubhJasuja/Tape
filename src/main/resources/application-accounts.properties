# Runtime and migration identities are configured separately.
spring.datasource.url=${TAPE_ACCOUNTS_URL:jdbc:postgresql://127.0.0.1:5433/tape}
spring.datasource.username=${TAPE_ACCOUNTS_USER:tape_runtime}
spring.datasource.password=${TAPE_ACCOUNTS_PASSWORD}
spring.sql.init.mode=never
spring.flyway.enabled=${TAPE_ACCOUNTS_MIGRATE:false}
spring.flyway.url=${TAPE_ACCOUNTS_URL:jdbc:postgresql://127.0.0.1:5433/tape}
spring.flyway.user=${TAPE_MIGRATION_USER:}
spring.flyway.password=${TAPE_MIGRATION_PASSWORD:}
spring.flyway.locations=classpath:db/migration/postgresql
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
server.error.include-message=never
server.error.include-binding-errors=never
server.servlet.session.timeout=20m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
server.tomcat.max-http-form-post-size=8KB
tape.synthetic-trading.enabled=${TAPE_SYNTHETIC_TRADING_ENABLED:false}
tape.synthetic-trading.matcher=${TAPE_SYNTHETIC_MATCHER_ENABLED:true}
