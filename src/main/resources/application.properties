server.address=127.0.0.1
spring.datasource.url=jdbc:h2:file:./data/tape
spring.sql.init.mode=always
spring.jackson.default-property-inclusion=non_null
server.error.include-message=always
spring.web.resources.static-locations=classpath:/static/,file:./frontend/dist/
spring.jackson.deserialization.accept-float-as-int=false
spring.profiles.default=h2-legacy
# The shared store is explicitly enabled only for the non-local accounts profile.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.session.SessionAutoConfiguration
spring.flyway.enabled=false
management.endpoints.access.default=none
management.endpoints.jmx.exposure.exclude=*
management.endpoints.web.exposure.exclude=*
