# Select with accounts,beta. No migration or provider enablement at runtime.
server.address=0.0.0.0
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.datasource.hikari.maximum-pool-size=${TAPE_DB_POOL_SIZE:8}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=5000
server.tomcat.threads.max=60
server.tomcat.max-connections=256
server.tomcat.accept-count=100
server.tomcat.connection-timeout=10s
server.tomcat.max-swallow-size=8KB
server.forward-headers-strategy=native
server.tomcat.remoteip.internal-proxies=${TAPE_TRUSTED_PROXY_REGEX:172[.]30[.]86[.]10}
