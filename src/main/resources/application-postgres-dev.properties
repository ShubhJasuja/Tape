# Trading and legacy schema.sql stay on a disposable H2 data source.
spring.datasource.url=jdbc:h2:mem:tape-postgres-dev

# Flyway alone connects to PostgreSQL in Stage 2A.
spring.flyway.enabled=true
spring.flyway.url=${TAPE_POSTGRES_URL:jdbc:postgresql://127.0.0.1:5433/tape}
spring.flyway.user=${TAPE_POSTGRES_USER:tape}
spring.flyway.password=${TAPE_POSTGRES_PASSWORD}
spring.flyway.locations=classpath:db/migration/postgresql
spring.flyway.clean-disabled=true
spring.flyway.baseline-on-migrate=false
