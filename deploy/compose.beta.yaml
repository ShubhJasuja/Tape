name: tape-beta
x-logging: &bounded-logs
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: tape
      POSTGRES_USER: tape
      POSTGRES_PASSWORD: ${TAPE_POSTGRES_PASSWORD:?Configure outside-repository environment file}
      TAPE_RUNTIME_PASSWORD: ${TAPE_ACCOUNTS_PASSWORD:?Set a separate runtime password}
    command: [postgres, -c, max_connections=50]
    volumes:
      - database:/var/lib/postgresql/data
      - ./init-runtime.sh:/docker-entrypoint-initdb.d/10-runtime.sh:ro
    networks:
      private:
        ipv4_address: 172.30.86.20
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -q -h 127.0.0.1 -U tape -d tape']
      interval: 5s
      retries: 12
    restart: unless-stopped
    mem_limit: 768m
    logging: *bounded-logs
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: tape-beta:local
    environment:
      SPRING_PROFILES_ACTIVE: accounts,beta,brevo
      TAPE_ACCOUNTS_URL: jdbc:postgresql://postgres:5432/tape
      TAPE_ACCOUNTS_USER: tape_runtime
      TAPE_ACCOUNTS_PASSWORD: ${TAPE_ACCOUNTS_PASSWORD:?Set runtime password}
      TAPE_ACCOUNTS_MIGRATE: 'false'
      TAPE_REGISTRATION_MODE: ${TAPE_REGISTRATION_MODE:-CLOSED}
      TAPE_REGISTRATION_ALLOWLIST: ${TAPE_REGISTRATION_ALLOWLIST:-}
      TAPE_PUBLIC_ORIGIN: ${TAPE_PUBLIC_ORIGIN:?Set canonical HTTPS origin including port}
      TAPE_MAIL_FROM: ${TAPE_MAIL_FROM:?Set verified sender}
      TAPE_IDENTITY_MAIL_KEY: ${TAPE_IDENTITY_MAIL_KEY:?Set persistent 32-byte Base64 key}
      TAPE_IDENTITY_MAIL_ENABLED: 'true'
      TAPE_SMTP_USER: ${TAPE_SMTP_USER:?Set SMTP login}
      TAPE_SMTP_PASSWORD: ${TAPE_SMTP_PASSWORD:?Set SMTP key}
      TAPE_OPS_TOKEN: ${TAPE_OPS_TOKEN:?Set random operations token}
      TAPE_SYNTHETIC_TRADING_ENABLED: 'true'
      TAPE_PRACTICE_OPTIONS_ENABLED: 'true'
      TAPE_PRACTICE_FUTURES_ENABLED: 'true'
      TAPE_MARKET_PERMISSIONS: ''
      TAPE_MARKET_PERMISSION_REF: ''
      UPSTOX_ANALYTICS_TOKEN: ''
      OLLAMA_MODEL: ''
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      private:
        ipv4_address: 172.30.86.30
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null --header="Authorization: Bearer $$TAPE_OPS_TOKEN" http://127.0.0.1:8080/actuator/health/readiness']
      interval: 30s
      start_period: 45s
      retries: 3
    stop_grace_period: 40s
    restart: unless-stopped
    mem_limit: 1024m
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *bounded-logs
  proxy:
    image: caddy:2-alpine
    environment:
      TAPE_BETA_HOST: ${TAPE_BETA_HOST:-localhost}
      TAPE_BETA_HTTPS_PORT: ${TAPE_BETA_HTTPS_PORT:-8443}
    ports:
      - '${TAPE_BETA_BIND:-127.0.0.1}:8443:443'
      - '${TAPE_BETA_BIND:-127.0.0.1}:8088:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - certificates:/data
      - proxy_config:/config
    depends_on: [app]
    networks:
      private:
        ipv4_address: 172.30.86.10
    restart: unless-stopped
    mem_limit: 128m
    logging: *bounded-logs
  migrate:
    profiles: [maintenance]
    image: tape-beta:local
    entrypoint: [java, -Xmx256m, -Duser.timezone=UTC, -Dloader.main=in.practice.tape.DatabaseMaintenance, -cp, app.jar, org.springframework.boot.loader.launch.PropertiesLauncher]
    command: [init, /opt/tape]
    environment:
      TAPE_MAINTENANCE_URL: jdbc:postgresql://postgres:5432/tape
      TAPE_MAINTENANCE_USER: tape
      TAPE_MAINTENANCE_PASSWORD: ${TAPE_POSTGRES_PASSWORD:?Set owner password}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [private]
networks:
  private:
    ipam:
      config:
        - subnet: 172.30.86.0/24
volumes:
  database:
  certificates:
  proxy_config:
